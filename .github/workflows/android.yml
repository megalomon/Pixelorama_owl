name: Android APK 🤖

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - ".claude/**"
  workflow_dispatch:
  # Rebuild the APK once a new engine template has been published.
  workflow_run:
    workflows: [ "Android Engine ⚙️" ]
    types: [ completed ]
    branches: [ master ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the godot-ci image tag below and GODOT_VERSION in .github/android-engine.env.
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: Pixelorama
  # Must match platform/android/java/app/config.gradle of the Godot version above.
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.1.0"
  ANDROID_NDK: "ndk;29.0.14206865"

permissions:
  contents: write  # Needed to publish the GitHub release with the APK.

jobs:
  check-engine:
    name: Check engine template ⚙️
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.engine.outputs.ready }}
      url: ${{ steps.engine.outputs.url }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Find engine release 🔍
        id: engine
        run: |
          engine_version=$(grep -oP '^GODOT_VERSION=\K.*' .github/android-engine.env)
          if [ "$engine_version" != "$GODOT_VERSION" ]; then
            echo "::error::GODOT_VERSION differs between android.yml ($GODOT_VERSION) and android-engine.env ($engine_version)."
            exit 1
          fi
          tag="engine-$engine_version-$(sha256sum .github/android-engine.env | cut -c1-8)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/android_source.zip"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if curl -sfIL -o /dev/null "$url"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Engine release $tag is not built yet. The APK will be built once the Android Engine workflow has published it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  export-android:
    name: Android Export 🤖
    needs: check-engine
    if: needs.check-engine.outputs.ready == 'true'
    runs-on: ubuntu-latest
    container:
      image: docker://barichello/godot-ci:4.7.2
    steps:
      - name: Check signing secrets 🔑
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_ALIAS KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ANDROID_${name} is not set."
              missing=1
            fi
          done
          exit $missing
        shell: bash
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup 💻
        # The image installs everything under /root, but GitHub runs container jobs with HOME=/github/home.
        run: |
          mkdir -v -p build ~/.local/share/godot/export_templates ~/.config
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.config/godot ~/.config/godot
          # Replace the official Gradle build template with the CPU-optimized engine build.
          wget -q -O ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip \
            "${{ needs.check-engine.outputs.url }}"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
      - name: Set up keystore 🔑
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Import resources once 📦
        continue-on-error: true
        run: godot --headless -v --import
      - name: Android Build 🔧
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          godot --headless -v --install-android-build-template --export-release "Android" ./build/${EXPORT_NAME}.apk
          test -f ./build/${EXPORT_NAME}.apk
          # Test variant using the Vulkan (Mobile) renderer, installable side by side (own package ID).
          godot --headless -v --export-release "Android Vulkan" ./build/${EXPORT_NAME}-Vulkan.apk
          test -f ./build/${EXPORT_NAME}-Vulkan.apk
      - name: Upload Artifact 🚀
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXPORT_NAME }}-Android
          path: ./build/*.apk
          retention-days: 30
      - name: Publish Release 📦
        # Stable download link: https://github.com/<owner>/<repo>/releases/latest/download/Pixelorama.apk
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from ${{ github.sha }} (${{ github.event_name }}).
            ${{ github.event.head_commit.message }}
          files: |
            ./build/${{ env.EXPORT_NAME }}.apk
            ./build/${{ env.EXPORT_NAME }}-Vulkan.apk
          make_latest: true
